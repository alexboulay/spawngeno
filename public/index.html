<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotIt!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d1a;
      --surface: #1a1a2e;
      --card:    #16213e;
      --primary: #e94560;
      --accent:  #4ecca3;
      --yellow:  #f5c518;
      --text:    #eaeaea;
      --dim:     #888;
      --r:       16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── screens ── */
    .screen { display: none; width: 100%; min-height: 100dvh; padding: 24px 20px; }
    .screen.active { display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 460px; text-align: center; }

    h1 { font-size: 2.6rem; }
    h2 { font-size: 1.8rem; margin-bottom: 12px; }
    .subtitle { color: var(--dim); margin-bottom: 28px; font-size: 1rem; }

    /* ── inputs & buttons ── */
    input[type="text"] {
      width: 100%; padding: 14px 16px; font-size: 1.15rem;
      border: 2px solid var(--card); border-radius: var(--r);
      background: var(--card); color: var(--text); outline: none;
      margin-bottom: 12px; transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    button {
      width: 100%; padding: 15px; font-size: 1.1rem; font-weight: 700;
      border: none; border-radius: var(--r); cursor: pointer;
      background: var(--primary); color: #fff;
      transition: opacity .2s, transform .1s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; border: 2px solid var(--accent); color: var(--accent);
    }

    .error { color: var(--primary); font-size: .9rem; margin-top: 8px; min-height: 20px; }

    /* ── lobby ── */
    .player-list { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; }
    .player-chip {
      background: var(--card); padding: 12px 16px; border-radius: var(--r);
      font-size: 1.05rem; text-align: left;
    }
    .dim-text { color: var(--dim); font-size: .95rem; margin: 10px 0; }

    /* ── round badge ── */
    .badge {
      display: inline-block; background: var(--primary);
      padding: 4px 14px; border-radius: 20px;
      font-size: .8rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 14px;
    }

    /* ── timer bar ── */
    .bar-wrap { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; margin: 14px 0; }
    .bar-fill { height: 100%; border-radius: 4px; width: 100%; }

    /* ── phase 1 carousel (memorize) ── */
    #p1-lane {
      width: 100%; height: 180px; position: relative;
      overflow: hidden; background: var(--surface);
      border-radius: var(--r); margin: 10px 0;
    }
    #p1-mover { position: absolute; }
    #p1-card {
      width: 140px; height: 140px; border-radius: 20px;
      background: var(--card);
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
    }
    #p1-emoji {
      width: 90px; height: 90px; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    #p1-emoji img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.4));
    }

    /* ── phase 2 selection grid ── */
    .selection-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin: 4px 0;
    }
    .sel-item {
      background: var(--card); border-radius: var(--r);
      padding: 14px; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: 3px solid transparent;
      transition: border-color .15s, background .15s, transform .08s;
      user-select: none; -webkit-user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .sel-item.selected {
      border-color: var(--accent);
      background: rgba(78, 204, 163, .18);
    }
    .sel-item:active { transform: scale(.91); }
    .sel-item img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.4));
    }

    .sel-count { font-size: .9rem; color: var(--dim); }
    .sel-count span { color: var(--accent); font-weight: 700; }

    /* ── results ── */
    .recap {
      background: var(--card); border-radius: var(--r);
      padding: 14px 16px; margin: 14px 0; text-align: left;
    }
    .recap-label { color: var(--dim); font-size: .85rem; margin-bottom: 10px; }
    .recap-items { display: flex; gap: 8px; flex-wrap: wrap; }
    .recap-item  {
      width: 44px; height: 44px; background: var(--surface);
      border-radius: 10px; padding: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .recap-item img { width: 100%; height: 100%; object-fit: contain; }

    .scores-header {
      display: grid; grid-template-columns: 1fr 56px 52px 52px;
      gap: 6px; padding: 0 16px;
      color: var(--dim); font-size: .72rem; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 4px; text-align: right;
    }
    .scores-header span:first-child { text-align: left; }

    .scores-list { display: flex; flex-direction: column; gap: 6px; }
    .score-row {
      background: var(--card); border-radius: var(--r); padding: 11px 16px;
      display: grid; grid-template-columns: 1fr 56px 52px 52px;
      align-items: center; gap: 6px; text-align: right;
    }
    .score-row.out { opacity: .45; }
    .score-name { text-align: left; font-weight: 600; font-size: .95rem; }
    .score-acc  { color: var(--dim); font-size: .9rem; }
    .score-pts  { color: var(--accent); font-weight: 700; }
    .score-tot  { color: var(--yellow); font-weight: 700; }

    .elim-banner {
      border-radius: var(--r); padding: 12px 16px;
      font-size: 1.1rem; font-weight: 700; margin: 14px 0;
    }
    .elim-banner.out    { background: rgba(233,69,96,.18); color: var(--primary); }
    .elim-banner.victor { background: rgba(78,204,163,.18); color: var(--accent); }

    /* ── game over ── */
    .trophy { width: 100px; height: 100px; margin: 0 auto 12px; }
    #winner-name { font-size: 2.2rem; color: var(--accent); margin-bottom: 6px; }
  </style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="container">
    <div style="width:80px;height:80px;margin:0 auto 6px"><img src="/assets/observation-eye-svgrepo-com.svg" style="width:100%;height:100%" alt="logo"></div>
    <h1>SpotIt!</h1>
    <p class="subtitle">Memory · Speed · Survival</p>
    <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off" spellcheck="false">
    <button id="join-btn">Join Game</button>
    <div id="join-error" class="error"></div>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen">
  <div class="container">
    <h2>Lobby</h2>
    <div id="player-list" class="player-list"></div>
    <p class="dim-text">Waiting for host to start…</p>
  </div>
</div>

<!-- PHASE 1 -->
<div id="phase1-screen" class="screen">
  <div class="container">
    <div class="badge">Round <span id="round-num">1</span></div>
    <h2 id="p1-title">Memorize!</h2>
    <p id="p1-hint" class="dim-text">Watch carefully!</p>
    <div id="p1-lane">
      <div id="p1-mover">
        <div id="p1-card">
          <div id="p1-emoji"></div>
        </div>
      </div>
    </div>
    <div class="bar-wrap"><div id="p1-bar" class="bar-fill" style="background:var(--accent)"></div></div>
  </div>
</div>

<!-- PHASE 2 -->
<div id="phase2-screen" class="screen">
  <div class="container">
    <h2>Select!</h2>
    <p class="dim-text" style="margin-bottom:14px">Tap the items you saw</p>
    <div id="selection-grid" class="selection-grid"></div>
    <div class="bar-wrap"><div id="p2-bar" class="bar-fill" style="background:var(--primary)"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <span class="sel-count">Selected: <span id="sel-count">0</span></span>
    </div>
    <button id="submit-btn" style="margin-top:12px">Submit</button>
  </div>
</div>

<!-- RESULTS -->
<div id="results-screen" class="screen">
  <div class="container">
    <h2>Round <span id="res-round">1</span></h2>

    <div class="recap">
      <div class="recap-label">The items were:</div>
      <div id="res-ref-items" class="recap-items"></div>
    </div>

    <div class="scores-header">
      <span>Player</span><span>Acc.</span><span>+Pts</span><span>Total</span>
    </div>
    <div id="scores-list" class="scores-list"></div>

    <div id="elim-banner" style="display:none" class="elim-banner"></div>

    <p class="dim-text" style="margin-top:10px">Waiting for host…</p>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen" class="screen">
  <div class="container">
    <div class="trophy"><img src="/assets/stars-star-svgrepo-com-2.svg" style="width:100%;height:100%" alt="winner"></div>
    <h1 id="winner-name"></h1>
    <p class="subtitle">wins the game!</p>
    <button id="play-again-btn" class="btn-ghost" style="margin-top:24px">Play Again</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let myId = null;

// phase 1 carousel state
let p1Items   = [];
let p1Index   = 0;
let p1Timer   = null;
let p1ItemDur = 2000;

// phase 2 grid state
let p2Items     = [];
let p2Selected  = new Set();
let p2Submitted = false;

// ── background music ──────────────────────────────────────────────────────────
const bgMusic  = new Audio('/assets/One_Life_Remaining.mp3');
bgMusic.loop   = true;
bgMusic.volume = 0.35;

function startMusic() {
  bgMusic.currentTime = 0;
  bgMusic.play().catch(() => {});
}
function stopMusic() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
}

// ── helpers ──────────────────────────────────────────────────────────────────

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setBar(el, ms, color) {
  if (color) el.style.background = color;
  el.style.transition = 'none';
  el.style.width = '100%';
  el.offsetHeight;
  el.style.transition = `width ${ms}ms linear`;
  el.style.width = '0%';
}

function stopBar(el) {
  el.style.transition = 'none';
  el.style.width = '0%';
}

// ── join screen ───────────────────────────────────────────────────────────────

function tryJoin() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { document.getElementById('join-error').textContent = 'Enter a name first'; return; }
  socket.emit('join', { name });
}

document.getElementById('join-btn').addEventListener('click', tryJoin);
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });

// ── socket events ─────────────────────────────────────────────────────────────

socket.on('joined', ({ id }) => {
  myId = id;
  document.getElementById('join-error').textContent = '';
  show('lobby-screen');
});

socket.on('join_error', msg => {
  document.getElementById('join-error').textContent = msg;
});

socket.on('lobby_update', ({ players }) => {
  document.getElementById('player-list').innerHTML = players
    .map(p => `<div class="player-chip">${esc(p.name)}</div>`)
    .join('');
});

// ── phase 1: carousel (memorize) ─────────────────────────────────────────────

socket.on('phase1_start', ({ items, itemDuration, round }) => {
  document.getElementById('round-num').textContent = round;
  document.getElementById('p1-title').textContent  = 'Memorize!';
  document.getElementById('p1-hint').textContent   = 'Watch carefully!';

  p1Items   = items;
  p1Index   = 0;
  p1ItemDur = itemDuration;

  const mover = document.getElementById('p1-mover');
  mover.style.transition = 'none';
  mover.style.left = '-200px';

  setBar(document.getElementById('p1-bar'), items.length * itemDuration, 'var(--accent)');
  show('phase1-screen');
  startMusic();
  setTimeout(advanceP1Carousel, 400);
});

socket.on('phase1_hide', () => {
  if (p1Timer) { clearTimeout(p1Timer); p1Timer = null; }
  document.getElementById('p1-title').textContent = 'Get Ready!';
  document.getElementById('p1-hint').textContent  = 'Selection incoming…';
  const mover = document.getElementById('p1-mover');
  mover.style.transition = 'none';
  mover.style.left = '-200px';
  stopBar(document.getElementById('p1-bar'));
});

function advanceP1Carousel() {
  if (p1Index >= p1Items.length) return;

  const item  = p1Items[p1Index];
  const lane  = document.getElementById('p1-lane');
  const mover = document.getElementById('p1-mover');
  const card  = document.getElementById('p1-card');

  document.getElementById('p1-emoji').innerHTML = `<img src="/assets/${item}" alt="item">`;

  const laneW = lane.offsetWidth;
  const cardW = card.offsetWidth;
  const cardH = card.offsetHeight;

  mover.style.transition = 'none';
  mover.style.top  = `${(lane.offsetHeight - cardH) / 2}px`;
  mover.style.left = `${laneW + 10}px`;
  mover.offsetHeight;

  mover.style.transition = `left ${p1ItemDur}ms linear`;
  mover.style.left = `${-cardW - 10}px`;

  p1Timer = setTimeout(() => { p1Index++; advanceP1Carousel(); }, p1ItemDur);
}

// ── phase 2: selection grid ───────────────────────────────────────────────────

socket.on('phase2_start', ({ items, totalDuration }) => {
  p2Items     = items;
  p2Selected  = new Set();
  p2Submitted = false;

  const grid = document.getElementById('selection-grid');
  grid.innerHTML = items.map(item =>
    `<div class="sel-item" data-item="${esc(item)}"><img src="/assets/${item}" alt="item"></div>`
  ).join('');

  grid.querySelectorAll('.sel-item').forEach(el => {
    el.addEventListener('click', () => {
      if (p2Submitted) return;
      const item = el.dataset.item;
      if (p2Selected.has(item)) {
        p2Selected.delete(item);
        el.classList.remove('selected');
      } else {
        p2Selected.add(item);
        el.classList.add('selected');
      }
      document.getElementById('sel-count').textContent = p2Selected.size;
    });
  });

  document.getElementById('sel-count').textContent = '0';
  document.getElementById('submit-btn').textContent = 'Submit';
  document.getElementById('submit-btn').disabled = false;

  setBar(document.getElementById('p2-bar'), totalDuration, 'var(--primary)');
  show('phase2-screen');
});

document.getElementById('submit-btn').addEventListener('click', () => {
  if (p2Submitted) return;
  p2Submitted = true;
  document.getElementById('submit-btn').textContent = 'Submitted ✓';
  document.getElementById('submit-btn').disabled = true;
  stopBar(document.getElementById('p2-bar'));
  socket.emit('submit_selection', { selected: Array.from(p2Selected) });
});

// ── results & game over ───────────────────────────────────────────────────────

socket.on('round_results', ({ round, refItems, scores, eliminated, winner }) => {
  stopMusic();

  document.getElementById('res-round').textContent = round;

  document.getElementById('res-ref-items').innerHTML =
    refItems.map(i => `<span class="recap-item"><img src="/assets/${i}" alt="item"></span>`).join('');

  document.getElementById('scores-list').innerHTML = scores.map(s => `
    <div class="score-row${s.eliminated ? ' out' : ''}">
      <span class="score-name">${esc(s.name)}${s.eliminated ? ' ❌' : ''}</span>
      <span class="score-acc">${s.accuracy}%</span>
      <span class="score-pts">+${s.roundScore}</span>
      <span class="score-tot">${s.totalScore}</span>
    </div>`).join('');

  const banner = document.getElementById('elim-banner');
  if (eliminated) {
    banner.textContent   = `❌ ${eliminated} has been eliminated!`;
    banner.className     = 'elim-banner out';
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }

  if (winner) {
    document.getElementById('winner-name').textContent = winner;
    show('results-screen');
    setTimeout(() => show('gameover-screen'), 3000);
  } else {
    show('results-screen');
  }
});

socket.on('game_reset', () => {
  if (p1Timer) { clearTimeout(p1Timer); p1Timer = null; }
  stopMusic();
  show('lobby-screen');
});

document.getElementById('play-again-btn').addEventListener('click', () => {
  socket.emit('play_again');
});
</script>
</body>
</html>
